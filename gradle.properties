# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=jeff.skyblockflipper

# Dependencies
fabric_api_version=0.155.2+26.2

# Settings screen. Cloth Config draws it and is required; Mod Menu only supplies the button that
