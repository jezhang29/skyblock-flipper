plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// For test-only dependencies. Loom supplies the Minecraft and Fabric repositories itself.
	mavenCentral()

	// Cloth Config, which draws the settings screen.
	maven { url = "https://maven.shedaniel.me/" }

	// Mod Menu, which puts a button on it.
	maven { url = "https://maven.terraformersmc.com/releases/" }

	// Text Placeholder API - not used here, but Mod Menu will not load without it.
	maven { url = "https://maven.nucleoid.xyz/" }

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The settings screen. Plain `implementation`, not `modImplementation`: Loom 1.17 removed the
	// mod* configurations and remaps any dependency it recognises as a mod, which is also why
	// Fabric API above is declared the same way. Each pulls its own Fabric API, excluded so the
	// version pinned in gradle.properties is the one on the classpath.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	implementation("com.terraformersmc:modmenu:${project.mod_menu_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// Mod Menu's optional Text Placeholder compat: it loads without this, but its mod-description
	// rendering takes a different path when present, and the dev client should run the path
	// players see. Runtime only, and never shipped - Mod Menu brings its own.
	localRuntime "eu.pb4:placeholder-api:${project.placeholder_api_version}"

	// Tests cover the `core` package only, which by design has no Minecraft on its classpath.
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()

	// Tests that hit the live Hypixel API are opt-in: `./gradlew test -PliveApi`.
	// They verify Hypixel's response shape rather than our code, so they must never be able
	// to fail a normal build when the network is down or the API is having a bad day.
	if (project.hasProperty("liveApi")) {
		systemProperty "skyblockflipper.liveApi", "true"
	}

	// The pet-level backtest is opt-in for a different reason: `./gradlew test -PtapeBacktest`.
	// It needs a recorded sales tape, which is tens of megabytes under someone's run/ directory
	// and is not in the repository, so an ordinary build must not depend on having one.
	if (project.hasProperty("tapeBacktest")) {
		systemProperty "skyblockflipper.tapeBacktest", "true"
		systemProperty "skyblockflipper.tapeDir",
				project.findProperty("tapeDir") ?: "run/config/skyblock-flipper/tape"
		// It prints the measurement it makes, which is the point of running it.
		testLogging.showStandardStreams = true
		maxHeapSize = "2g"
	}

	testLogging {
		events "passed", "skipped", "failed"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Pin the JDK Gradle compiles with, so the build does not depend on whatever
	// `java` happens to be on PATH. MC 26.2 requires 25.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
